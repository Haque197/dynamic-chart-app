<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Chart Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Dynamic Chart Application</h1>
        
        <!-- Database Connection Form -->
        <div class="card mb-4">
            <div class="card-header">
                Database Connection
            </div>
            <div class="card-body">
                <form id="connectionForm">
                    <div class="mb-3">
                        <label for="server" class="form-label">Server</label>
                        <input type="text" class="form-control" id="server" required>
                    </div>
                    <div class="mb-3">
                        <label for="database" class="form-label">Database</label>
                        <input type="text" class="form-control" id="database" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="integratedSecurity">
                        <label class="form-check-label" for="integratedSecurity">Use Windows Authentication</label>
                    </div>
                    <div id="credentialsSection">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Connect</button>
                </form>
            </div>
        </div>

        <!-- Object Selection -->
        <div class="card mb-4" id="objectSelection" style="display: none;">
            <div class="card-header">
                Select Database Object
            </div>
            <div class="card-body">
                <select class="form-select" id="databaseObject">
                    <option value="">Select an object...</option>
                </select>
            </div>
        </div>

        <!-- Chart Configuration -->
        <div class="card mb-4" id="chartConfig" style="display: none;">
            <div class="card-header">
                Chart Configuration
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label for="chartType" class="form-label">Chart Type</label>
                    <select class="form-select" id="chartType">
                        <option value="line">Line Chart</option>
                        <option value="bar">Bar Chart</option>
                        <option value="radar">Radar Chart</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Field Mapping</label>
                    <div id="fieldMapping">
                        <!-- Dynamically populated -->
                    </div>
                </div>
                <button type="button" class="btn btn-primary" id="generateChart">Generate Chart</button>
            </div>
        </div>

        <!-- Chart Display -->
        <div class="card" id="chartDisplay" style="display: none;">
            <div class="card-header">
                Chart
            </div>
            <div class="card-body">
                <canvas id="chartCanvas"></canvas>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/site.js"></script>
</body>
</html>
